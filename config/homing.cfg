# =========================
# Central current config
# =========================
[gcode_macro CURRENT_CFG]
# --- Normal (standard) currents ---
variable_xy_standard_run:   0.90
variable_xy_standard_hold:  0.50
variable_z_standard_run:    0.80
variable_z_standard_hold:   0.40

# --- Reduced currents for sensorless XY homing ---
variable_xy_home_run:       0.60
variable_xy_home_hold:      0.30

gcode:
  # Apply standard currents immediately
  SET_TMC_CURRENT STEPPER=stepper_x CURRENT={printer["gcode_macro CURRENT_CFG"].variable_xy_standard_run} HOLDCURRENT={printer["gcode_macro CURRENT_CFG"].variable_xy_standard_hold}
  SET_TMC_CURRENT STEPPER=stepper_y CURRENT={printer["gcode_macro CURRENT_CFG"].variable_xy_standard_run} HOLDCURRENT={printer["gcode_macro CURRENT_CFG"].variable_xy_standard_hold}
  SET_TMC_CURRENT STEPPER=stepper_z CURRENT={printer["gcode_macro CURRENT_CFG"].variable_z_standard_run} HOLDCURRENT={printer["gcode_macro CURRENT_CFG"].variable_z_standard_hold}
  SET_TMC_CURRENT STEPPER=stepper_z1 CURRENT={printer["gcode_macro CURRENT_CFG"].variable_z_standard_run} HOLDCURRENT={printer["gcode_macro CURRENT_CFG"].variable_z_standard_hold}
  SET_TMC_CURRENT STEPPER=stepper_z2 CURRENT={printer["gcode_macro CURRENT_CFG"].variable_z_standard_run} HOLDCURRENT={printer["gcode_macro CURRENT_CFG"].variable_z_standard_hold}
  SET_TMC_CURRENT STEPPER=stepper_z3 CURRENT={printer["gcode_macro CURRENT_CFG"].variable_z_standard_run} HOLDCURRENT={printer["gcode_macro CURRENT_CFG"].variable_z_standard_hold}
  RESPOND TYPE=command MSG="Standard currents applied"

# Run on startup
[delayed_gcode INIT_CURRENTS]
initial_duration: 1
gcode:
  CURRENT_CFG

# =========================
# Helpers for XY homing
# =========================
[gcode_macro _SET_XY_HOME_CURRENTS]
gcode:
  {% set cfg = printer["gcode_macro CURRENT_CFG"] %}
  SET_TMC_CURRENT STEPPER=stepper_x CURRENT={cfg.variable_xy_home_run} HOLDCURRENT={cfg.variable_xy_home_hold}
  SET_TMC_CURRENT STEPPER=stepper_y CURRENT={cfg.variable_xy_home_run} HOLDCURRENT={cfg.variable_xy_home_hold}
  M400

[gcode_macro _RESTORE_STANDARD_CURRENTS]
gcode:
  CURRENT_CFG   # reapply all standard currents
  M400

# =========================
# Patch lazy_home flow
# =========================
[gcode_macro _lazy_home_inner]
gcode:
  {% set G28 = (printer["gcode_macro list_macros"].macros.g28|default(["g28"], True))[-1] %}
  {% set axes = 'XYZ'|select('in', params.AXES|default("XYZ")|upper|list) %}
  {% if not axes %}
    {% set axes = 'XYZ' %}
  {% endif %}
  {% if params.LAZY|default(1)|int %}
    {% set axes = axes|reject('in', printer.toolhead.homed_axes|upper)|join() %}
  {% endif %}

  {% if axes %}
    {% set do_xy = ('X' in axes) or ('Y' in axes) %}

    _KM_PRINT_STATUS ACTION=PUSH_STATUS
    _KM_PRINT_STATUS ACTION=CHANGE STATUS=homing

    # Lower XY current if needed
    {% if do_xy %}
      _SET_XY_HOME_CURRENTS
    {% endif %}

    # Ensure currents are restored even on error
    {% try %}
      {G28}{% for k in axes %}{' ' ~ k}{% endfor %}
    {% finally %}
      _RESTORE_STANDARD_CURRENTS
    {% endtry %}

    _KM_PRINT_STATUS ACTION=CHANGE STATUS=pop_status
  {% endif %}

# =========================
# Optional convenience
# =========================
[gcode_macro HOME_X]
gcode: LAZY_HOME LAZY=0 AXES=X

[gcode_macro HOME_Y]
gcode: LAZY_HOME LAZY=0 AXES=Y