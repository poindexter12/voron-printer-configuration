# =========================
# Central current config
# =========================
[gcode_macro CURRENT_CFG]
# --- Normal (STANDARD) currents ---
variable_xy_standard_current:      0.90
variable_xy_standard_hold_current: 0.50
variable_z_standard_current:       0.80
variable_z_standard_hold_current:  0.40

# --- Reduced (HOME) currents for homing passes ---
variable_xy_home_current:          0.60
variable_xy_home_hold_current:     0.30
variable_z_home_current:           0.80   # same as standard by default (safe)
variable_z_home_hold_current:      0.40   # same as standard by default

gcode:
  RESPOND TYPE=command MSG="CURRENT_CFG ready"

# =========================
# Setters (explicit, reusable)
# =========================
[gcode_macro SET_XY_STANDARD_CURRENTS]
gcode:
  {% set cfg = printer["gcode_macro CURRENT_CFG"] %}
  SET_TMC_CURRENT STEPPER=stepper_x CURRENT={cfg.xy_standard_current} HOLDCURRENT={cfg.xy_standard_hold_current}
  SET_TMC_CURRENT STEPPER=stepper_y CURRENT={cfg.xy_standard_current} HOLDCURRENT={cfg.xy_standard_hold_current}

[gcode_macro SET_Z_STANDARD_CURRENTS]
gcode:
  {% set cfg = printer["gcode_macro CURRENT_CFG"] %}
  SET_TMC_CURRENT STEPPER=stepper_z  CURRENT={cfg.z_standard_current} HOLDCURRENT={cfg.z_standard_hold_current}
  SET_TMC_CURRENT STEPPER=stepper_z1 CURRENT={cfg.z_standard_current} HOLDCURRENT={cfg.z_standard_hold_current}
  SET_TMC_CURRENT STEPPER=stepper_z2 CURRENT={cfg.z_standard_current} HOLDCURRENT={cfg.z_standard_hold_current}
  SET_TMC_CURRENT STEPPER=stepper_z3 CURRENT={cfg.z_standard_current} HOLDCURRENT={cfg.z_standard_hold_current}

[gcode_macro SET_XY_HOME_CURRENTS]
gcode:
  {% set cfg = printer["gcode_macro CURRENT_CFG"] %}
  SET_TMC_CURRENT STEPPER=stepper_x CURRENT={cfg.xy_home_current} HOLDCURRENT={cfg.xy_home_hold_current}
  SET_TMC_CURRENT STEPPER=stepper_y CURRENT={cfg.xy_home_current} HOLDCURRENT={cfg.xy_home_hold_current}

[gcode_macro SET_Z_HOME_CURRENTS]
gcode:
  {% set cfg = printer["gcode_macro CURRENT_CFG"] %}
  SET_TMC_CURRENT STEPPER=stepper_z  CURRENT={cfg.z_home_current} HOLDCURRENT={cfg.z_home_hold_current}
  SET_TMC_CURRENT STEPPER=stepper_z1 CURRENT={cfg.z_home_current} HOLDCURRENT={cfg.z_home_hold_current}
  SET_TMC_CURRENT STEPPER=stepper_z2 CURRENT={cfg.z_home_current} HOLDCURRENT={cfg.z_home_hold_current}
  SET_TMC_CURRENT STEPPER=stepper_z3 CURRENT={cfg.z_home_current} HOLDCURRENT={cfg.z_home_hold_current}

# =========================
# Apply STANDARD currents on startup
# =========================
[delayed_gcode INIT_CURRENTS]
initial_duration: 1
gcode:
  SET_XY_STANDARD_CURRENTS
  SET_Z_STANDARD_CURRENTS
  RESPOND TYPE=command MSG="Standard XY/Z currents applied"

# =========================
# Optional convenience buttons
# =========================
[gcode_macro HOME_X]
gcode: LAZY_HOME LAZY=0 AXES=X

[gcode_macro HOME_Y]
gcode: LAZY_HOME LAZY=0 AXES=Y

[gcode_macro HOME_Z]
gcode: LAZY_HOME LAZY=0 AXES=Z

# =========================
# Override: homing currents around LAZY_HOME
# =========================
# klipper-macros' own _lazy_home_inner (klipper-macros/kinematics.cfg) homes
# without touching motor current, so homing ran at the STANDARD currents that
# INIT_CURRENTS applies at boot. The setters above existed but nothing called
# them on the homing path.
#
# This file is included at printer.cfg:22, after [include klipper-macros/*.cfg]
# at :19, so this declaration wins - Klipper takes last-wins on a duplicated
# section. That is deliberate here and is why the section is listed in
# INTENTIONAL_OVERRIDES in tests/test_config_structure.py.
#
# Previously this lived as an uncommitted edit inside the klipper-macros
# submodule working tree on the Pi, where no backup could see it and any
# submodule update would have erased it silently (issue #17).
#
# Two fixes carried over from that edit, both worth keeping:
#   - `'XYZ'|select('in', req)` yields a generator, not a string. Without the
#     final `join` the later `'Z' in axes` test and the G28 loop misbehave.
#   - Pruning already-homed axes can empty the set; upstream then fell through
#     to an empty {G28} with the status stack already pushed.
[gcode_macro _lazy_home_inner]
gcode:
  # --- resolve base G28 and requested axes ---
  {% set G28 = (printer["gcode_macro list_macros"].macros.g28 | default(["g28"], True))[-1] %}
  {% set req = params.AXES|default("XYZ")|upper %}
  {% set axes = ('XYZ' | select('in', req) | join) %}  # join to a string, not a generator

  {% if not axes %}  # No axes means home everything.
    {% set axes = 'XYZ' %}
  {% endif %}

  {% if params.LAZY|default(1)|int %}  # Prune out already-homed axes.
    {% set axes = (axes | list | reject('in', printer.toolhead.homed_axes|upper) | join) %}
  {% endif %}

  {% if not axes %}
    # If pruning removed all, nothing to home.
    RESPOND TYPE=command MSG="lazy_home: nothing to home (already homed)"
  {% else %}
    _KM_PRINT_STATUS ACTION=PUSH_STATUS
    _KM_PRINT_STATUS ACTION=CHANGE STATUS=homing

    # --- set homing currents (XY always; Z only if included) ---
    SET_XY_HOME_CURRENTS
    {% if 'Z' in axes %} SET_Z_HOME_CURRENTS {% endif %}
    M400

    # --- perform homing ---
    {G28}{% for k in axes %}{' ' ~ k}{% endfor %}

    # --- restore standard currents ---
    SET_XY_STANDARD_CURRENTS
    {% if 'Z' in axes %} SET_Z_STANDARD_CURRENTS {% endif %}
    M400

    _KM_PRINT_STATUS ACTION=CHANGE STATUS=pop_status
  {% endif %}
