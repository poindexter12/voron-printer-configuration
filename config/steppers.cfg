
[stepper_x]
step_pin: X_STEP_PIN
dir_pin:  X_DIRECTION_PIN
enable_pin: !X_ENABLE_PIN
microsteps: 32
rotation_distance: 40
endstop_pin: tmc5160_stepper_x:virtual_endstop
position_min: 0
position_endstop: 0      # Homing puts you at X=0
position_max: 355           # Adjusted for actual travel
homing_speed: 80
homing_retract_dist: 0
homing_positive_dir: False  # Homing toward min end (front-left)

[stepper_y]
step_pin: Y_STEP_PIN
dir_pin:  Y_DIRECTION_PIN
enable_pin: !Y_ENABLE_PIN
microsteps: 32
rotation_distance: 40
endstop_pin: tmc5160_stepper_y:virtual_endstop
position_min: 0
position_endstop: 0         # Homing puts you at Y=0
position_max: 355           # Adjusted for actual travel
homing_speed: 80
homing_retract_dist: 0
homing_positive_dir: False  # Homing toward min end (front-left)

[stepper_z]
step_pin: Z0_STEP_PIN
dir_pin:  Z0_DIRECTION_PIN
enable_pin: !Z0_ENABLE_PIN
microsteps: 32
rotation_distance: 40
gear_ratio: 80:16
endstop_pin: probe:z_virtual_endstop
position_min: -3    
position_max: 250
homing_speed: 10
second_homing_speed: 3
homing_retract_dist: 3

[stepper_z1]
step_pin: Z1_STEP_PIN
dir_pin:  !Z1_DIRECTION_PIN
enable_pin: !Z1_ENABLE_PIN
microsteps: 32
rotation_distance: 40
gear_ratio: 80:16

[stepper_z2]
step_pin: Z2_STEP_PIN
dir_pin:  Z2_DIRECTION_PIN
enable_pin: !Z2_ENABLE_PIN
microsteps: 32
rotation_distance: 40
gear_ratio: 80:16

[stepper_z3]
step_pin: Z3_STEP_PIN
dir_pin:  !Z3_DIRECTION_PIN
enable_pin: !Z3_ENABLE_PIN
microsteps: 32
rotation_distance: 40
gear_ratio: 80:16

[tmc5160 stepper_x]
cs_pin: X_CHIP_SELECT_PIN
spi_bus: spi1
diag1_pin: ^!X_ENDSTOP_PIN
sense_resistor: 0.11
run_current: 0.9
hold_current: 0.5
stealthchop_threshold: 0
driver_SGT: 0
interpolate: False

[tmc5160 stepper_y]
cs_pin: Y_CHIP_SELECT_PIN
spi_bus: spi1
diag1_pin: ^!Y_ENDSTOP_PIN
sense_resistor: 0.11
run_current: 0.9
hold_current: 0.5
stealthchop_threshold: 0
driver_SGT: -2
interpolate: False

[tmc5160 stepper_z]
cs_pin: Z0_CHIP_SELECT_PIN
spi_bus: spi1
sense_resistor: 0.11
run_current: 0.6
hold_current: 0.35
stealthchop_threshold: 0
interpolate: True

[tmc5160 stepper_z1]
cs_pin: Z1_CHIP_SELECT_PIN
spi_bus: spi1
sense_resistor: 0.11
run_current: 0.6
hold_current: 0.35
stealthchop_threshold: 0
interpolate: True

[tmc5160 stepper_z2]
cs_pin: Z2_CHIP_SELECT_PIN
spi_bus: spi1
sense_resistor: 0.11
run_current: 0.6
hold_current: 0.35
stealthchop_threshold: 0
interpolate: True

[tmc5160 stepper_z3]
cs_pin: Z3_CHIP_SELECT_PIN
spi_bus: spi1
sense_resistor: 0.11
run_current: 0.6
hold_current: 0.35
stealthchop_threshold: 0
interpolate: True 
