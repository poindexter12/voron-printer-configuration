[gcode_macro _PRESSURE_ADVANCE_GENERATE]
description: Internal helper that generates G-code commands for pressure advance calibration
gcode:
    {% if params.DRY_RUN|default(0)|int %} DRY_RUN_WRAP_START {% endif %}

    # ===== Generate G-code commands for pressure advance calibration =====
    
    # ===== Parameter Setup =====
    {% set pa_start_value = params.PA_START_VALUE|default(0.0)|float %}
    {% set pa_end_value = params.PA_END_VALUE|default(0.08)|float %}
    {% set pa_increment = params.PA_INCREMENT|default(0.005)|float %}
    {% set pattern_count = params.PATTERN_COUNT|default(17)|int %}
    {% set wall_count = params.WALL_COUNT|default(3)|int %}
    {% set first_layer_height = params.FIRST_LAYER_HEIGHT|default(0.25)|float %}
    {% set first_layer_speed = params.FIRST_LAYER_SPEED|default(25)|float %}
    {% set travel_speed = params.TRAVEL_SPEED|default(120)|float %}
    {% set nozzle_temp = params.NOZZLE_TEMP|default(215)|float %}
    {% set bed_temp = params.BED_TEMP|default(75)|float %}
    {% set first_layer_fan = params.FIRST_LAYER_FAN|default(0)|float %}
    {% set retraction_distance = params.RETRACTION_DISTANCE|default(0.5)|float %}
    {% set retraction_speed = params.RETRACTION_SPEED|default(35)|float %}
    {% set z_hop_height = params.Z_HOP_HEIGHT|default(0.1)|float %}
    {% set anchor_frame_perimeters = params.ANCHOR_FRAME_PERIMETERS|default(4)|int %}

    # ===== Bed Size and Position Calculation =====
    {% set bed_size_x = 350.0 %}
    {% set bed_size_y = 350.0 %}
    {% set pattern_width = 84.72 %}
    {% set pattern_height = 53.99 %}
    
    {% set start_x = (bed_size_x - pattern_width) / 2 %}
    {% set end_x = (bed_size_x + pattern_width) / 2 %}
    {% set start_y = (bed_size_y - pattern_height) / 2 %}
    {% set end_y = (bed_size_y + pattern_height) / 2 %}

    # ===== Calculated Values =====
    {% set first_layer_speed_mm_per_min = (first_layer_speed * 60.0) %}
    {% set travel_speed_mm_per_min = (travel_speed * 60.0) %}
    {% set retraction_speed_mm_per_min = (retraction_speed * 60.0) %}
    {% set first_layer_fan_pwm = (first_layer_fan/100.0*255) | int %}

    # ===== Generate the G-code commands as a list =====
    {% set gcode_commands = [] %}
    
    # Add setup commands
    {% set _ = gcode_commands.append("M117 Starting PA calibration...") %}
    {% set _ = gcode_commands.append("M140 S" + bed_temp|string) %}
    {% set _ = gcode_commands.append("M190 S" + bed_temp|string) %}
    {% set _ = gcode_commands.append("M104 S" + nozzle_temp|string) %}
    {% set _ = gcode_commands.append("M109 S" + nozzle_temp|string) %}
    {% set _ = gcode_commands.append("G28") %}
    {% set _ = gcode_commands.append("G21") %}
    {% set _ = gcode_commands.append("G90") %}
    {% set _ = gcode_commands.append("M83") %}
    {% set _ = gcode_commands.append("G92 E0") %}
    {% set _ = gcode_commands.append("M106 S" + first_layer_fan_pwm|string) %}
    
    # Add start printing commands
    {% set _ = gcode_commands.append("G1 E-" + retraction_distance|string + " F" + retraction_speed_mm_per_min|string) %}
    {% set _ = gcode_commands.append("G0 Z5 F" + travel_speed_mm_per_min|string) %}
    {% set _ = gcode_commands.append("G0 X" + start_x|string + " Y" + start_y|string + " F" + travel_speed_mm_per_min|string) %}
    {% set _ = gcode_commands.append("G0 Z" + first_layer_height|string + " F" + travel_speed_mm_per_min|string) %}
    {% set _ = gcode_commands.append("G1 E" + retraction_distance|string + " F" + retraction_speed_mm_per_min|string) %}
    
    # Add anchor frame perimeters
    {% for perimeter in range(anchor_frame_perimeters) %}
        {% set offset = perimeter * 0.5 %}
        {% set frame_start_x = start_x + offset %}
        {% set frame_start_y = start_y + offset %}
        {% set frame_end_x = end_x - offset %}
        {% set frame_end_y = end_y - offset %}
        
        {% set _ = gcode_commands.append("; Perimeter " + (perimeter + 1)|string) %}
        {% set _ = gcode_commands.append("G1 X" + frame_start_x|string + " Y" + frame_start_y|string + " E0.5 F" + first_layer_speed_mm_per_min|string) %}
        {% set _ = gcode_commands.append("G1 X" + frame_end_x|string + " Y" + frame_start_y|string + " E1.0 F" + first_layer_speed_mm_per_min|string) %}
        {% set _ = gcode_commands.append("G1 X" + frame_end_x|string + " Y" + frame_end_y|string + " E1.5 F" + first_layer_speed_mm_per_min|string) %}
        {% set _ = gcode_commands.append("G1 X" + frame_start_x|string + " Y" + frame_end_y|string + " E2.0 F" + first_layer_speed_mm_per_min|string) %}
        {% set _ = gcode_commands.append("G1 X" + frame_start_x|string + " Y" + frame_start_y|string + " E2.5 F" + first_layer_speed_mm_per_min|string) %}
    {% endfor %}
    
    # Add anchor frame fill
    {% set fill_start_x = start_x + 1.5 %}
    {% set fill_end_x = end_x - 1.5 %}
    {% set fill_start_y = start_y + 1.5 %}
    {% set fill_end_y = end_y - 1.5 %}
    
    {% set current_e = 2.5 %}
    {% for y_pos in range(0, 20) %}
        {% set y_coord = fill_start_y + (y_pos * 0.5) %}
        {% if y_coord <= fill_end_y %}
            {% set _ = gcode_commands.append("G0 X" + fill_start_x|string + " Y" + y_coord|string + " F" + travel_speed_mm_per_min|string) %}
            {% set current_e = current_e + 0.5 %}
            {% set _ = gcode_commands.append("G1 X" + fill_end_x|string + " Y" + y_coord|string + " E" + current_e|string + " F" + first_layer_speed_mm_per_min|string) %}
            {% set current_e = current_e + 0.5 %}
        {% endif %}
    {% endfor %}
    
    # Add pressure advance patterns
    {% for pattern_index in range(pattern_count) %}
        {% set current_pa = pa_start_value + (pattern_index * pa_increment) %}
        
        {% set _ = gcode_commands.append("; Pattern " + (pattern_index + 1)|string + " - PA " + current_pa|string) %}
        {% set _ = gcode_commands.append("SET_PRESSURE_ADVANCE ADVANCE=" + current_pa|string) %}
        {% set _ = gcode_commands.append("M117 PA " + current_pa|string) %}
        
        {% set row = pattern_index // 3 %}
        {% set col = pattern_index % 3 %}
        {% set pattern_x = start_x + 5 + (col * 28) %}
        {% set pattern_y = start_y + 5 + (row * 8) %}
        {% set pattern_size = 20 %}
        
        {% set _ = gcode_commands.append("G1 E-" + retraction_distance|string + " F" + retraction_speed_mm_per_min|string) %}
        {% set _ = gcode_commands.append("G1 Z" + z_hop_height|string + " F" + travel_speed_mm_per_min|string) %}
        {% set _ = gcode_commands.append("G0 X" + pattern_x|string + " Y" + pattern_y|string + " F" + travel_speed_mm_per_min|string) %}
        {% set _ = gcode_commands.append("G1 Z" + first_layer_height|string + " F" + travel_speed_mm_per_min|string) %}
        {% set _ = gcode_commands.append("G1 E" + retraction_distance|string + " F" + retraction_speed_mm_per_min|string) %}
        
        # Pattern walls
        {% for wall in range(wall_count) %}
            {% set wall_offset = wall * 0.5 %}
            {% set wall_start_x = pattern_x + wall_offset %}
            {% set wall_start_y = pattern_y + wall_offset %}
            {% set wall_end_x = pattern_x + pattern_size - wall_offset %}
            {% set wall_end_y = pattern_y + pattern_size - wall_offset %}
            
            {% set _ = gcode_commands.append("; Wall " + (wall + 1)|string) %}
            {% set _ = gcode_commands.append("G1 X" + wall_start_x|string + " Y" + wall_start_y|string + " E0.5 F" + first_layer_speed_mm_per_min|string) %}
            {% set _ = gcode_commands.append("G1 X" + wall_end_x|string + " Y" + wall_start_y|string + " E1.0 F" + first_layer_speed_mm_per_min|string) %}
            {% set _ = gcode_commands.append("G1 X" + wall_end_x|string + " Y" + wall_end_y|string + " E1.5 F" + first_layer_speed_mm_per_min|string) %}
            {% set _ = gcode_commands.append("G1 X" + wall_start_x|string + " Y" + wall_end_y|string + " E2.0 F" + first_layer_speed_mm_per_min|string) %}
            {% set _ = gcode_commands.append("G1 X" + wall_start_x|string + " Y" + wall_start_y|string + " E2.5 F" + first_layer_speed_mm_per_min|string) %}
        {% endfor %}
        
        # Pattern fill
        {% set fill_start_x = pattern_x + 1.5 %}
        {% set fill_end_x = pattern_x + pattern_size - 1.5 %}
        {% set fill_start_y = pattern_y + 1.5 %}
        {% set fill_end_y = pattern_y + pattern_size - 1.5 %}
        
        {% set current_e = 2.5 %}
        {% for y_pos in range(0, 8) %}
            {% set y_coord = fill_start_y + (y_pos * 0.5) %}
            {% if y_coord <= fill_end_y %}
                {% set _ = gcode_commands.append("G0 X" + fill_start_x|string + " Y" + y_coord|string + " F" + travel_speed_mm_per_min|string) %}
                {% set current_e = current_e + 0.5 %}
                {% set _ = gcode_commands.append("G1 X" + fill_end_x|string + " Y" + y_coord|string + " E" + current_e|string + " F" + first_layer_speed_mm_per_min|string) %}
                {% set current_e = current_e + 0.5 %}
            {% endif %}
        {% endfor %}
    {% endfor %}
    
    # Add finalization commands
    {% set _ = gcode_commands.append("G0 Z10 F" + travel_speed_mm_per_min|string) %}
    {% set _ = gcode_commands.append("G0 X" + start_x|string + " Y" + start_y|string + " F" + travel_speed_mm_per_min|string) %}
    {% set _ = gcode_commands.append("M104 S0") %}
    {% set _ = gcode_commands.append("M140 S0") %}
    {% set _ = gcode_commands.append("M106 S0") %}
    {% set _ = gcode_commands.append("M117 Pressure advance calibration complete!") %}
    
    # Store the commands in a variable that other macros can access
    {% set _ = printer.save_variable('_pa_gcode_commands', gcode_commands) %}

    {% if params.DRY_RUN|default(0)|int %} DRY_RUN_WRAP_END {% endif %}


[gcode_macro PRESSURE_ADVANCE_CALIBRATION]
description: |
    Pressure advance calibration macro for easy calling from Mainsail.
    Calls the internal _PRESSURE_ADVANCE_CALIBRATION macro with default parameters.
    
    Usage examples:
    - PRESSURE_ADVANCE_CALIBRATION (uses all defaults)
    - PRESSURE_ADVANCE_CALIBRATION PA_START_VALUE=0.01 PA_END_VALUE=0.06
    - PRESSURE_ADVANCE_CALIBRATION PA_INCREMENT=0.01
    - PRESSURE_ADVANCE_CALIBRATION DRY_RUN=1 (output G-code instead of executing)
gcode:

    {% if params.DRY_RUN|default(0)|int %} DRY_RUN_WRAP_START {% endif %}
    ; Call the internal macro with parameters
    _PRESSURE_ADVANCE_CALIBRATION \
        PA_START_VALUE={params.PA_START_VALUE|default(0.0)} \
        PA_END_VALUE={params.PA_END_VALUE|default(0.08)} \
        PA_INCREMENT={params.PA_INCREMENT|default(0.005)} \
        PATTERN_COUNT={params.PATTERN_COUNT|default(17)} \
        WALL_COUNT={params.WALL_COUNT|default(3)} \
        FIRST_LAYER_HEIGHT={params.FIRST_LAYER_HEIGHT|default(0.25)} \
        FIRST_LAYER_SPEED={params.FIRST_LAYER_SPEED|default(25)} \
        TRAVEL_SPEED={params.TRAVEL_SPEED|default(120)} \
        NOZZLE_TEMP={params.NOZZLE_TEMP|default(215)} \
        BED_TEMP={params.BED_TEMP|default(75)} \
        FIRST_LAYER_FAN={params.FIRST_LAYER_FAN|default(0)} \
        RETRACTION_DISTANCE={params.RETRACTION_DISTANCE|default(0.5)} \
        RETRACTION_SPEED={params.RETRACTION_SPEED|default(35)} \
        Z_HOP_HEIGHT={params.Z_HOP_HEIGHT|default(0.1)} \
        ANCHOR_FRAME_PERIMETERS={params.ANCHOR_FRAME_PERIMETERS|default(4)} \
        DRY_RUN={params.DRY_RUN|default(0)} \

    {% if params.DRY_RUN|default(0)|int %} DRY_RUN_WRAP_END {% endif %}
