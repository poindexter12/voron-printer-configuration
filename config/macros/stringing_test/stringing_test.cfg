[gcode_macro STRINGING_TEST]
description: Parametric retraction/stringing tower - two single-wall pillars,
#   retraction distance steps up per band of layers. Read results by band
#   height: band N retraction = RETRACT_START + N * RETRACT_INCREMENT.
# Parameters (all optional):
#  CENTER_X / CENTER_Y: center point between the pillars (default 175/175)
#  PILLAR_SIZE: square pillar side length in mm (default 15)
#  PILLAR_SPACING: center-to-center distance between pillars (default 90)
#  BAND_COUNT: number of retraction bands (default 5)
#  LAYERS_PER_BAND: layers per band (default 10)
#  RETRACT_START: band 0 retraction distance mm (default 0.2)
#  RETRACT_INCREMENT: added per band mm (default 0.2)
#  RETRACT_SPEED / UNRETRACT_SPEED: mm/s (default 40 / 30)
#  LAYER_HEIGHT: mm (default 0.2)
#  LINE_WIDTH: mm (default 0.4)
#  PRINT_SPEED / TRAVEL_SPEED: mm/s (default 60 / 250)
#  HOTEND_TEMP / BED_TEMP: C (default 215 / 65)
#  FILAMENT_DIAMETER: mm (default 1.75)
#  EXTRUSION_MULTIPLIER: (default 1.0)
#  PREP: 1 = heat + home + QGL + mesh first, 0 = assume ready (default 1)
gcode:
    {% set center_x = params.CENTER_X|default(175)|float %}
    {% set center_y = params.CENTER_Y|default(175)|float %}
    {% set pillar_size = params.PILLAR_SIZE|default(15)|float %}
    {% set spacing = params.PILLAR_SPACING|default(90)|float %}
    {% set band_count = params.BAND_COUNT|default(5)|int %}
    {% set layers_per_band = params.LAYERS_PER_BAND|default(10)|int %}
    {% set retract_start = params.RETRACT_START|default(0.2)|float %}
    {% set retract_increment = params.RETRACT_INCREMENT|default(0.2)|float %}
    {% set retract_speed = params.RETRACT_SPEED|default(40)|float %}
    {% set unretract_speed = params.UNRETRACT_SPEED|default(30)|float %}
    {% set layer_height = params.LAYER_HEIGHT|default(0.2)|float %}
    {% set line_width = params.LINE_WIDTH|default(0.4)|float %}
    {% set print_speed = params.PRINT_SPEED|default(60)|float %}
    {% set travel_speed = params.TRAVEL_SPEED|default(250)|float %}
    {% set hotend_temp = params.HOTEND_TEMP|default(215)|float %}
    {% set bed_temp = params.BED_TEMP|default(65)|float %}
    {% set filament_diameter = params.FILAMENT_DIAMETER|default(1.75)|float %}
    {% set extrusion_multiplier = params.EXTRUSION_MULTIPLIER|default(1.0)|float %}
    {% set prep = params.PREP|default(1)|int %}

    {% set pi = 3.141592653589793 %}
    {% set line_area = (line_width - layer_height) * layer_height + pi * (layer_height/2) * (layer_height/2) %}
    {% set filament_area = pi * (filament_diameter/2) * (filament_diameter/2) %}
    {% set e_per_mm = (line_area / filament_area) * extrusion_multiplier %}
    {% set half = pillar_size / 2 %}
    {% set lx = center_x - spacing/2 %}
    {% set rx = center_x + spacing/2 %}

    {% if prep %}
    M140 S{bed_temp}
    M190 S{bed_temp}
    M104 S{hotend_temp}
    G28
    QUAD_GANTRY_LEVEL
    G28 Z
    BED_MESH_CALIBRATE
    M109 S{hotend_temp}
    {% endif %}

    G90
    M83 ; relative extrusion
    ; --- first layer skirt around both pillars (prime the melt zone) ---
    {% set sk = 6.0 %}
    {% set sx0 = lx - half - sk %}
    {% set sx1 = rx + half + sk %}
    {% set sy0 = center_y - half - sk %}
    {% set sy1 = center_y + half + sk %}
    G1 Z{ '%.3f' % layer_height } F1200
    G1 X{ '%.3f' % sx0 } Y{ '%.3f' % sy0 } F{ (travel_speed*60)|int }
    G1 X{ '%.3f' % sx1 } Y{ '%.3f' % sy0 } E{ '%.5f' % (e_per_mm * (sx1-sx0)) } F{ (print_speed*60)|int }
    G1 X{ '%.3f' % sx1 } Y{ '%.3f' % sy1 } E{ '%.5f' % (e_per_mm * (sy1-sy0)) }
    G1 X{ '%.3f' % sx0 } Y{ '%.3f' % sy1 } E{ '%.5f' % (e_per_mm * (sx1-sx0)) }
    G1 X{ '%.3f' % sx0 } Y{ '%.3f' % sy0 } E{ '%.5f' % (e_per_mm * (sy1-sy0)) }
    G1 E-{ '%.5f' % retract_start } F{ (retract_speed*60)|int } ; balance first band unretract

    ; --- pillar bands ---
    {% for band in range(band_count) %}
    {% set retract = retract_start + band * retract_increment %}
    M117 Band { band + 1 }/{ band_count }: retract { '%.2f' % retract }mm
    {% for layer in range(layers_per_band) %}
    {% set n = band * layers_per_band + layer %}
    {% set z = (n + 1) * layer_height %}
    G1 Z{ '%.3f' % z } F1200
    {% for px in [lx, rx] %}
    G1 X{ '%.3f' % (px - half) } Y{ '%.3f' % (center_y - half) } F{ (travel_speed*60)|int }
    G1 E{ '%.5f' % retract } F{ (unretract_speed*60)|int }
    G1 X{ '%.3f' % (px + half) } Y{ '%.3f' % (center_y - half) } E{ '%.5f' % (e_per_mm * pillar_size) } F{ (print_speed*60)|int }
    G1 X{ '%.3f' % (px + half) } Y{ '%.3f' % (center_y + half) } E{ '%.5f' % (e_per_mm * pillar_size) }
    G1 X{ '%.3f' % (px - half) } Y{ '%.3f' % (center_y + half) } E{ '%.5f' % (e_per_mm * pillar_size) }
    G1 X{ '%.3f' % (px - half) } Y{ '%.3f' % (center_y - half) } E{ '%.5f' % (e_per_mm * pillar_size) }
    G1 E-{ '%.5f' % retract } F{ (retract_speed*60)|int }
    {% endfor %}
    {% endfor %}
    {% endfor %}

    ; --- finish: final unretract stays out; park up and off ---
    G1 Z{ '%.3f' % ((band_count * layers_per_band) * layer_height + 5) } F1200
    M117 Stringing test done
