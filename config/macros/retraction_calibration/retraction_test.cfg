[gcode_macro RETRACTION_TEST]
description: Draw a rectangular perimeter layer with multiple perimeters stepping inward
# depends on: retract_unretract.cfg
# depends on: draw_perimeter_layer.cfg
# depends on: fill.cfg
# Parameters:
#  BED_SIZE_X: Bed size in X direction (mm)
#  BED_SIZE_Y: Bed size in Y direction (mm)
#  NOZZLE_DIAMETER: Nozzle diameter (mm)
#  LINE_WIDTH: Line width for printing (mm)
#  LAYER_HEIGHT: Layer height (mm)
#  NUM_PERIMETERS: Number of perimeters to draw
#  STEP_DISTANCE: Distance to step inward for each perimeter (mm)
#  FIRST_LAYER_PRINT_SPEED: Print speed for first layer (mm/min)
#  TRAVEL_SPEED: Travel speed (mm/min)
#  Z_HOP_DISTANCE: Z hop distance when retracting (mm, 0 = no hop)
#  Z_HOP_RETURN: Z hop return distance when unretracting (mm, 0 = no return)
#  RETRACT_SPEED: Speed for retracting filament (mm/min)
#  UNRETRACT_SPEED: Speed for unretracting filament (mm/min)
#  RETRACT_DISTANCE: Distance to retract filament (mm)
#  OTHER_LAYERS_PRINT_SPEED: Print speed for other layers (mm/min)
#  FILAMENT_DIAMETER: Filament diameter (mm)
#  EXTRUSION_MULTIPLIER: Extrusion multiplier

gcode:
    
    ; ### Ellis' Pressure Advance / Linear Advance Calibration Tool ###
    ;
    ; Original Marlin linear advance calibration tool by Sineos [https://github.com/Sineos]
    ; Heavily modified/rewritten by Andrew Ellis [https://github.com/AndrewEllis93]
    ;
    ; -------------------------------------------
    ; Generated: Tue Aug 19 2025 08:30:29 GMT-0700 (Pacific Daylight Time)
    ; -------------------------------------------
    ;
    ; Advanced Mode: true
    ;
    ; Printer:
    ;  - Firmware: klipper
    ;  - Bed Shape: Rect
    ;  - Bed Size X: 350 mm
    ;  - Bed Size Y: 350 mm
    ;  - Origin Bed Center: false
    ;  - Extruder Name: Disabled
    ;  - Travel Speed: 120 mm/s
    ;  - Nozzle Diameter: 0.4 mm
    ;  - Filament Diameter: 1.7 mm
    ;  - Extrusion Multiplier: 1
    ;
    ; Retraction / Z Hop:
    ;  - Firmware Retraction: false
    ;  - Retraction Distance: 0.5 mm
    ;  - Retract Speed: 35 mm/s
    ;  - Unretract Speed: 35 mm/s
    ;  - Z Hop Enable: true
    ;  - Z Hop Height: 0.1mm
    ;
    ; First Layer Settings:
    ;  - First Layer Height: 0.25 mm
    ;  - First Layer Printing Speed: 30 mm/s
    ;  - First Layer Fan Speed: 0%
    ;  - Anchor Option: anchor_frame
    ;  - Anchor Frame Perimeters: 4
    ;  - Anchor Line Width: 140 %
    ;
    ; Print Settings:
    ;  - Line Width: 112.5 %
    ;  - Layer Count: 4
    ;  - Layer Height: 0.2 mm
    ;  - Print Speed: 100 mm/s
    ;  - Acceleration: Disabled
    ;  - Fan Speed: 100%
    ;
    ; Pattern Settings `(Customized)`:
    ;  - Wall Count: 3
    ;  - Side Length: 30 mm
    ;  - Spacing: 2 mm
    ;  - Corner Angle: 90 degrees 
    ;  - Printing Direction: 0 degree
    ;
    ; Pressure Advance Stepping:
    ;  - PA Start Value: 0
    ;  - PA End Value: 0.08
    ;  - PA Increment: 0.005
    ;  - Increment Smooth Time Instead: false
    ;  - Show on LCD: true
    ;  - Number Tab: true
    ;  - No Leading Zeroes: false
    ;
    ; Start / End G-code:
    ;  - Hotend Temp: 200C
    ;  - Bed Temp: 60C
    ;  - Don't Add G28: false
    ;  - Don't Add Heating G-Codes: false
    ;  - Entered Start G-code: 
    ;       G28 ; Home all axes
    ;       M190 S60 ; Set & wait for bed temp
    ;       M109 S200 ; Set & wait for hotend temp
    ;       PRINT_START ; Start macro
    ;       ; START_PRINT ; Start macro (alternate / official start macro name)
    ;  - Entered End G-code: 
    ;       PRINT_END ; End macro. Change name to match yours
    ;
    ; Calculated Values:
    ;  - Print Size X: 84.72 mm
    ;  - Print Size Y: 53.99 mm
    ;  - Number of Patterns to Print: 17
    ;  - PA Values: 0, 0.005, 0.01, 0.015, 0.02, 0.025, 0.03, 0.035, 0.04, 0.045, 0.05, 0.055, 0.06, 0.065, 0.07, 0.075, 0.08
    ;
    ; Prepare printing
    ;

    {% set bed_size_x = params.BED_SIZE_X|default(350)|float %}
    {% set bed_size_y = params.BED_SIZE_Y|default(350)|float %}
    {% set nozzle_diameter = params.NOZZLE_DIAMETER|default(0.4)|float %}

    ; Calculate pattern dimensions using the same formulas as the JavaScript
    {% set PI = 3.141592653589793 %}
    {% set num_patterns = params.NUM_PATTERNS|default(17)|int %}  ; PA values 0 to 0.08 in 0.005 steps
    {% set wall_count = params.WALL_COUNT|default(3)|int %}
    {% set pattern_spacing = params.PATTERN_SPACING|default(2)|float %}
    {% set wall_side_length = params.WALL_SIDE_LENGTH|default(30.0)|float %}
    {% set corner_angle = params.CORNER_ANGLE|default(90)|float %}
    
    ; Line width percentages for different layers
    {% set first_layer_line_width_percent = params.FIRST_LAYER_LINE_WIDTH_PERCENT|default(140.0)|float %}
    {% set other_layers_line_width_percent = params.OTHER_LAYERS_LINE_WIDTH_PERCENT|default(112.5)|float %}
    
    ; Calculate actual line widths in mm for each layer type
    {% set first_layer_line_width_mm = (nozzle_diameter * first_layer_line_width_percent) / 100 %}
    {% set other_layers_line_width_mm = (nozzle_diameter * other_layers_line_width_percent) / 100 %}
    
    ; Layer-specific settings
    {% set first_layer_height = params.FIRST_LAYER_HEIGHT|default(0.25)|float %}
    {% set other_layer_height = params.OTHER_LAYER_HEIGHT|default(0.2)|float %}
    {% set first_layer_print_speed = params.FIRST_LAYER_PRINT_SPEED|default(1800)|float %}
    {% set other_layers_print_speed = params.OTHER_LAYERS_PRINT_SPEED|default(6000)|float %}
    {% set travel_speed = params.TRAVEL_SPEED|default(7200)|float %}
    {% set z_hop_distance = params.Z_HOP_DISTANCE|default(0.1)|float %}
    {% set z_hop_return = params.Z_HOP_RETURN|default(0.25)|float %}
    {% set retract_speed = params.RETRACT_SPEED|default(2100)|float %}
    {% set unretract_speed = params.UNRETRACT_SPEED|default(2100)|float %}
    {% set retract_distance = params.RETRACT_DISTANCE|default(0.5)|float %}
    {% set filament_diameter = params.FILAMENT_DIAMETER|default(1.7)|float %}
    {% set extrusion_multiplier = params.EXTRUSION_MULTIPLIER|default(1.0)|float %}

    ; Calculate step distances for each layer type (using the line width for spacing)
    {% set first_layer_step_distance = first_layer_line_width_mm * 0.866 %}  ; line_width * cos(30°)
    {% set other_layers_step_distance = other_layers_line_width_mm * 0.866 %}  ; line_width * cos(30°)

    M117 First Layer Line Width: { first_layer_line_width_mm }mm ({ first_layer_line_width_percent }%)
    M117 Other Layers Line Width: { other_layers_line_width_mm }mm ({ other_layers_line_width_percent }%)
    M117 First Layer Step Distance: { first_layer_step_distance }
    M117 Other Layers Step Distance: { other_layers_step_distance }
    M117 First Layer Print Speed: { first_layer_print_speed }
    M117 Other Layers Print Speed: { other_layers_print_speed }
    M117 Travel Speed: { travel_speed }
    M117 Z Hop Distance: { z_hop_distance }
    M117 Z Hop Return: { z_hop_return }
    M117 Retract Speed: { retract_speed }
    M117 Unretract Speed: { unretract_speed }
    M117 Retract Distance: { retract_distance }

    ; === Main anchor rectangle dimensions (from original.gcode lines 108-126) ===
    ; This is the large rectangle that anchors the print
    {% set main_rect_start_x = 132.6417 %}
    {% set main_rect_start_y = 148.0068 %}
    {% set main_rect_width = 84.7166 %}    ; 217.3583 - 132.6417
    {% set main_rect_height = 42.4264 %}   ; 190.4332 - 148.0068
    {% set main_rect_step_distance = 0.5063495408493621 %}
    {% set num_perimeters = 4 %}

    ; === Top rectangle dimensions (from original.gcode lines 134-152) ===
    ; This is the smaller rectangle above the main one for number labels
    {% set top_rect_start_x = 132.6417 %}
    {% set top_rect_start_y = 190.9396 %}
    {% set top_rect_width = 64.2545 %}     ; 196.8962 - 132.6417
    {% set top_rect_height = 11.5063 %}    ; 202.4459 - 190.9396
    {% set top_rect_step_distance = 0.5063495408493621 %}

    M117 Main Rect: { main_rect_start_x },{ main_rect_start_y } { main_rect_width }x{ main_rect_height }
    M117 Top Rect: { top_rect_start_x },{ top_rect_start_y } { top_rect_width }x{ top_rect_height }
    

    G28 ; Home all axes
    M190 S60 ; Set & wait for bed temp
    M109 S200 ; Set & wait for hotend temp
    PRINT_START ; Start macro
    ; START_PRINT ; Start macro (alternate / official start macro name)
    G21 ; Millimeter units
    G90 ; Absolute XYZ
    M83 ; Relative E
    G92 E0 ; Reset extruder distance
    ;
    ;  Begin printing
    ;
    M106 S0 ; Set fan speed
    G1 E-{ retract_distance } F{ retract_speed } ; Retract
    G0 Z5 F7200 ; Z raise
    G0 X132.6417 Y148.0068 F7200 ; Move to start position
    G0 Z0.25 F7200 ; Move to start layer height
    G1 E{ retract_distance } F{ unretract_speed } ; Un-retract
    SET_PRESSURE_ADVANCE ADVANCE=0 ; Set pressure advance to start value
    M117 PA 0

    ; Draw main anchor rectangle perimeters (first layer)
    _DRAW_PERIMETER_LAYER \
        START_X={ main_rect_start_x } \
        START_Y={ main_rect_start_y } \
        WIDTH={ main_rect_width } \
        HEIGHT={ main_rect_height } \
        LINE_WIDTH={ first_layer_line_width_mm } \
        LAYER_HEIGHT={ first_layer_height } \
        NUM_PERIMETERS={ num_perimeters } \
        STEP_DISTANCE={ main_rect_step_distance } \
        PRINT_SPEED={ first_layer_print_speed } \
        TRAVEL_SPEED={ travel_speed } \
        FILAMENT_DIAMETER={ filament_diameter } \
        EXTRUSION_MULTIPLIER={ extrusion_multiplier }

    ; Retract, Z-hop, move to top rectangle start, Z-return, unretract
    _RETRACT_UNRETRACT \
        Z_HOP_DISTANCE=0.35 \
        Z_HOP_RETURN=0.25 \
        TRAVEL_SPEED={ travel_speed } \
        RETRACT_SPEED={ retract_speed } \
        UNRETRACT_SPEED={ unretract_speed } \
        RETRACT_DISTANCE={ retract_distance } \
        MOVE_X={ top_rect_start_x } \
        MOVE_Y={ top_rect_start_y }

    ; Draw top rectangle perimeters (for number labels - still on first layer)
    _DRAW_PERIMETER_LAYER \
        START_X={ top_rect_start_x } \
        START_Y={ top_rect_start_y } \
        WIDTH={ top_rect_width } \
        HEIGHT={ top_rect_height } \
        LINE_WIDTH={ other_layers_line_width_mm } \
        LAYER_HEIGHT={ other_layer_height } \
        NUM_PERIMETERS={ num_perimeters } \
        STEP_DISTANCE={ top_rect_step_distance } \
        PRINT_SPEED={ first_layer_print_speed } \
        TRAVEL_SPEED={ travel_speed } \
        FILAMENT_DIAMETER={ filament_diameter } \
        EXTRUSION_MULTIPLIER={ extrusion_multiplier }

    ; Fill the top rectangle with diagonal infill pattern
    _FILL \
        MIN_X=134.5341 \
        MAX_X=195.0038 \
        MIN_Y=192.8319 \
        MAX_Y=200.5535 \
        STEP_SIZE=0.7161 \
        PRINT_SPEED={ first_layer_print_speed } \
        TRAVEL_SPEED={ travel_speed } \
        EXTRUSION_PER_MM=0.05577

    _RETRACT_UNRETRACT \
        Z_HOP_DISTANCE={ z_hop_distance } \
        Z_HOP_RETURN={ z_hop_return } \
        TRAVEL_SPEED={ travel_speed } \
        RETRACT_SPEED={ retract_speed } \
        UNRETRACT_SPEED={ unretract_speed } \
        RETRACT_DISTANCE={ retract_distance } \
        MOVE_X=137.2384 \
        MOVE_Y=149.8992

    ; First layer PA test pattern
    _PRESSURE_ADVANCE_LOOP \
        START_ADVANCE=0.0 \
        END_ADVANCE=0.08 \
        INCREMENT=0.005 \
        START_X=137.2384 \
        START_Y=149.8992 \
        Y_START=188.5408 \
        Y_END=169.22 \
        E_INCREMENT=1.19281 \
        X_WALL_OFFSET=19.3208 \
        STEP_DISTANCE=0.5757 \
        GROUP_SPACING=1.8743 \
        PRINT_SPEED={ first_layer_print_speed } \
        TRAVEL_SPEED={ travel_speed } \
        Z_HOP_DISTANCE={ z_hop_distance } \
        Z_HOP_RETURN={ z_hop_return } \
        RETRACT_SPEED={ retract_speed } \
        UNRETRACT_SPEED={ unretract_speed } \
        RETRACT_DISTANCE={ retract_distance }

    G1 E-0.5 F2100 ; Retract
    G1 Z0.35 F7200 ; Z hop
    G0 X137.2384 Y149.8992 F7200 ; Move back to start position
    G1 Z0.25 F7200 ; Z hop return
    G1 E0.5 F2100 ; Un-retract
    M106 S255 ; Set fan speed
    G0 Z0.45 F7200 ; Move to layer height
    SET_PRESSURE_ADVANCE ADVANCE=0 ; Set pressure advance to start value for numbering
    M117 PA 0

    ; ===== PA Value Labels Section =====
    ; Common parameters for all glyphs
    {% set glyph_extrusion = 0.07174 %}
    {% set glyph_print_speed = 1800 %}
    {% set glyph_travel_speed = 7200 %}
    {% set glyph_retract = 0.5 %}
    {% set glyph_retract_speed = 2100 %}
    {% set glyph_z_hop = 0.55 %}
    {% set glyph_z_return = 0.45 %}

    ; First glyph: Digit 0 at column 1 (initial setup done separately)
    G1 E-{ glyph_retract } F{ glyph_retract_speed }
    G1 Z{ glyph_z_hop } F{ glyph_travel_speed }
    G0 X133.9217 Y191.8832 F{ glyph_travel_speed }
    G1 Z{ glyph_z_return } F{ glyph_travel_speed }
    G1 E{ glyph_retract } F{ glyph_retract_speed }
    _DRAW_DIGIT DIGIT=0 START_X=133.9217 START_Y=191.8832 EXTRUSION={ glyph_extrusion } PRINT_SPEED={ glyph_print_speed } TRAVEL_SPEED={ glyph_travel_speed }

    ; Column 1: "0" "0" "." "0" "5" for PA 0.005
    _DRAW_GLYPH_WITH_TRAVEL GLYPH=0 GLYPH_X=141.1245 GLYPH_Y=191.8832 EXTRUSION={ glyph_extrusion } PRINT_SPEED={ glyph_print_speed } TRAVEL_SPEED={ glyph_travel_speed } RETRACT_DISTANCE={ glyph_retract } RETRACT_SPEED={ glyph_retract_speed } UNRETRACT_SPEED={ glyph_retract_speed } Z_HOP={ glyph_z_hop } Z_RETURN={ glyph_z_return }
    _DRAW_GLYPH_WITH_TRAVEL GLYPH=period GLYPH_X=145.1245 GLYPH_Y=194.8832 EXTRUSION={ glyph_extrusion } PRINT_SPEED={ glyph_print_speed } TRAVEL_SPEED={ glyph_travel_speed } RETRACT_DISTANCE={ glyph_retract } RETRACT_SPEED={ glyph_retract_speed } UNRETRACT_SPEED={ glyph_retract_speed } Z_HOP={ glyph_z_hop } Z_RETURN={ glyph_z_return }
    _DRAW_GLYPH_WITH_TRAVEL GLYPH=0 GLYPH_X=141.1245 GLYPH_Y=195.8832 EXTRUSION={ glyph_extrusion } PRINT_SPEED={ glyph_print_speed } TRAVEL_SPEED={ glyph_travel_speed } RETRACT_DISTANCE={ glyph_retract } RETRACT_SPEED={ glyph_retract_speed } UNRETRACT_SPEED={ glyph_retract_speed } Z_HOP={ glyph_z_hop } Z_RETURN={ glyph_z_return }
    _DRAW_GLYPH_WITH_TRAVEL GLYPH=1 GLYPH_X=141.1245 GLYPH_Y=198.8832 EXTRUSION={ glyph_extrusion } PRINT_SPEED={ glyph_print_speed } TRAVEL_SPEED={ glyph_travel_speed } RETRACT_DISTANCE={ glyph_retract } RETRACT_SPEED={ glyph_retract_speed } UNRETRACT_SPEED={ glyph_retract_speed } Z_HOP={ glyph_z_hop } Z_RETURN={ glyph_z_return }

    ; Column 2: "0" "." "0" "2" for PA 0.01
    _DRAW_GLYPH_WITH_TRAVEL GLYPH=0 GLYPH_X=148.3273 GLYPH_Y=191.8832 EXTRUSION={ glyph_extrusion } PRINT_SPEED={ glyph_print_speed } TRAVEL_SPEED={ glyph_travel_speed } RETRACT_DISTANCE={ glyph_retract } RETRACT_SPEED={ glyph_retract_speed } UNRETRACT_SPEED={ glyph_retract_speed } Z_HOP={ glyph_z_hop } Z_RETURN={ glyph_z_return }
    _DRAW_GLYPH_WITH_TRAVEL GLYPH=period GLYPH_X=152.3273 GLYPH_Y=194.8832 EXTRUSION={ glyph_extrusion } PRINT_SPEED={ glyph_print_speed } TRAVEL_SPEED={ glyph_travel_speed } RETRACT_DISTANCE={ glyph_retract } RETRACT_SPEED={ glyph_retract_speed } UNRETRACT_SPEED={ glyph_retract_speed } Z_HOP={ glyph_z_hop } Z_RETURN={ glyph_z_return }
    _DRAW_GLYPH_WITH_TRAVEL GLYPH=0 GLYPH_X=148.3273 GLYPH_Y=195.8832 EXTRUSION={ glyph_extrusion } PRINT_SPEED={ glyph_print_speed } TRAVEL_SPEED={ glyph_travel_speed } RETRACT_DISTANCE={ glyph_retract } RETRACT_SPEED={ glyph_retract_speed } UNRETRACT_SPEED={ glyph_retract_speed } Z_HOP={ glyph_z_hop } Z_RETURN={ glyph_z_return }
    _DRAW_GLYPH_WITH_TRAVEL GLYPH=2 GLYPH_X=148.3273 GLYPH_Y=198.8832 EXTRUSION={ glyph_extrusion } PRINT_SPEED={ glyph_print_speed } TRAVEL_SPEED={ glyph_travel_speed } RETRACT_DISTANCE={ glyph_retract } RETRACT_SPEED={ glyph_retract_speed } UNRETRACT_SPEED={ glyph_retract_speed } Z_HOP={ glyph_z_hop } Z_RETURN={ glyph_z_return }

    ; Column 3: "0" "." "0" "3" for PA 0.015
    _DRAW_GLYPH_WITH_TRAVEL GLYPH=0 GLYPH_X=155.5301 GLYPH_Y=191.8832 EXTRUSION={ glyph_extrusion } PRINT_SPEED={ glyph_print_speed } TRAVEL_SPEED={ glyph_travel_speed } RETRACT_DISTANCE={ glyph_retract } RETRACT_SPEED={ glyph_retract_speed } UNRETRACT_SPEED={ glyph_retract_speed } Z_HOP={ glyph_z_hop } Z_RETURN={ glyph_z_return }
    _DRAW_GLYPH_WITH_TRAVEL GLYPH=period GLYPH_X=159.5301 GLYPH_Y=194.8832 EXTRUSION={ glyph_extrusion } PRINT_SPEED={ glyph_print_speed } TRAVEL_SPEED={ glyph_travel_speed } RETRACT_DISTANCE={ glyph_retract } RETRACT_SPEED={ glyph_retract_speed } UNRETRACT_SPEED={ glyph_retract_speed } Z_HOP={ glyph_z_hop } Z_RETURN={ glyph_z_return }
    _DRAW_GLYPH_WITH_TRAVEL GLYPH=0 GLYPH_X=155.5301 GLYPH_Y=195.8832 EXTRUSION={ glyph_extrusion } PRINT_SPEED={ glyph_print_speed } TRAVEL_SPEED={ glyph_travel_speed } RETRACT_DISTANCE={ glyph_retract } RETRACT_SPEED={ glyph_retract_speed } UNRETRACT_SPEED={ glyph_retract_speed } Z_HOP={ glyph_z_hop } Z_RETURN={ glyph_z_return }
    _DRAW_GLYPH_WITH_TRAVEL GLYPH=3 GLYPH_X=155.5301 GLYPH_Y=198.8832 EXTRUSION={ glyph_extrusion } PRINT_SPEED={ glyph_print_speed } TRAVEL_SPEED={ glyph_travel_speed } RETRACT_DISTANCE={ glyph_retract } RETRACT_SPEED={ glyph_retract_speed } UNRETRACT_SPEED={ glyph_retract_speed } Z_HOP={ glyph_z_hop } Z_RETURN={ glyph_z_return }

    ; Column 4: "0" "." "0" "4" for PA 0.02
    _DRAW_GLYPH_WITH_TRAVEL GLYPH=0 GLYPH_X=162.7329 GLYPH_Y=191.8832 EXTRUSION={ glyph_extrusion } PRINT_SPEED={ glyph_print_speed } TRAVEL_SPEED={ glyph_travel_speed } RETRACT_DISTANCE={ glyph_retract } RETRACT_SPEED={ glyph_retract_speed } UNRETRACT_SPEED={ glyph_retract_speed } Z_HOP={ glyph_z_hop } Z_RETURN={ glyph_z_return }
    _DRAW_GLYPH_WITH_TRAVEL GLYPH=period GLYPH_X=166.7329 GLYPH_Y=194.8832 EXTRUSION={ glyph_extrusion } PRINT_SPEED={ glyph_print_speed } TRAVEL_SPEED={ glyph_travel_speed } RETRACT_DISTANCE={ glyph_retract } RETRACT_SPEED={ glyph_retract_speed } UNRETRACT_SPEED={ glyph_retract_speed } Z_HOP={ glyph_z_hop } Z_RETURN={ glyph_z_return }
    _DRAW_GLYPH_WITH_TRAVEL GLYPH=0 GLYPH_X=162.7329 GLYPH_Y=195.8832 EXTRUSION={ glyph_extrusion } PRINT_SPEED={ glyph_print_speed } TRAVEL_SPEED={ glyph_travel_speed } RETRACT_DISTANCE={ glyph_retract } RETRACT_SPEED={ glyph_retract_speed } UNRETRACT_SPEED={ glyph_retract_speed } Z_HOP={ glyph_z_hop } Z_RETURN={ glyph_z_return }
    _DRAW_GLYPH_WITH_TRAVEL GLYPH=4 GLYPH_X=162.7329 GLYPH_Y=200.8832 EXTRUSION={ glyph_extrusion } PRINT_SPEED={ glyph_print_speed } TRAVEL_SPEED={ glyph_travel_speed } RETRACT_DISTANCE={ glyph_retract } RETRACT_SPEED={ glyph_retract_speed } UNRETRACT_SPEED={ glyph_retract_speed } Z_HOP={ glyph_z_hop } Z_RETURN={ glyph_z_return }

    ; Column 5: "0" "." "0" "5" for PA 0.025
    _DRAW_GLYPH_WITH_TRAVEL GLYPH=0 GLYPH_X=169.9357 GLYPH_Y=191.8832 EXTRUSION={ glyph_extrusion } PRINT_SPEED={ glyph_print_speed } TRAVEL_SPEED={ glyph_travel_speed } RETRACT_DISTANCE={ glyph_retract } RETRACT_SPEED={ glyph_retract_speed } UNRETRACT_SPEED={ glyph_retract_speed } Z_HOP={ glyph_z_hop } Z_RETURN={ glyph_z_return }
    _DRAW_GLYPH_WITH_TRAVEL GLYPH=period GLYPH_X=173.9357 GLYPH_Y=194.8832 EXTRUSION={ glyph_extrusion } PRINT_SPEED={ glyph_print_speed } TRAVEL_SPEED={ glyph_travel_speed } RETRACT_DISTANCE={ glyph_retract } RETRACT_SPEED={ glyph_retract_speed } UNRETRACT_SPEED={ glyph_retract_speed } Z_HOP={ glyph_z_hop } Z_RETURN={ glyph_z_return }
    _DRAW_GLYPH_WITH_TRAVEL GLYPH=0 GLYPH_X=169.9357 GLYPH_Y=195.8832 EXTRUSION={ glyph_extrusion } PRINT_SPEED={ glyph_print_speed } TRAVEL_SPEED={ glyph_travel_speed } RETRACT_DISTANCE={ glyph_retract } RETRACT_SPEED={ glyph_retract_speed } UNRETRACT_SPEED={ glyph_retract_speed } Z_HOP={ glyph_z_hop } Z_RETURN={ glyph_z_return }
    _DRAW_GLYPH_WITH_TRAVEL GLYPH=5 GLYPH_X=169.9357 GLYPH_Y=200.8832 EXTRUSION={ glyph_extrusion } PRINT_SPEED={ glyph_print_speed } TRAVEL_SPEED={ glyph_travel_speed } RETRACT_DISTANCE={ glyph_retract } RETRACT_SPEED={ glyph_retract_speed } UNRETRACT_SPEED={ glyph_retract_speed } Z_HOP={ glyph_z_hop } Z_RETURN={ glyph_z_return }

    ; Column 6: "0" "." "0" "6" for PA 0.03
    _DRAW_GLYPH_WITH_TRAVEL GLYPH=0 GLYPH_X=177.1384 GLYPH_Y=191.8832 EXTRUSION={ glyph_extrusion } PRINT_SPEED={ glyph_print_speed } TRAVEL_SPEED={ glyph_travel_speed } RETRACT_DISTANCE={ glyph_retract } RETRACT_SPEED={ glyph_retract_speed } UNRETRACT_SPEED={ glyph_retract_speed } Z_HOP={ glyph_z_hop } Z_RETURN={ glyph_z_return }
