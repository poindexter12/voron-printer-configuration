# Glyph Drawing Macros for Retraction Test
# Draws digits and period for PA value labels
# Patterns extracted from original.gcode to match exact output

[gcode_macro _DRAW_GLYPH_WITH_TRAVEL]
description: Retract, travel to position, unretract, and draw a glyph (digit or period)
parameters:
  GLYPH: The glyph to draw (0-9 or "period")
  GLYPH_X: Target X position for glyph
  GLYPH_Y: Target Y position for glyph
  EXTRUSION: Extrusion amount per segment
  PRINT_SPEED: Print speed for drawing
  TRAVEL_SPEED: Travel speed for moves
  RETRACT_DISTANCE: Retract distance
  RETRACT_SPEED: Retract speed
  UNRETRACT_SPEED: Unretract speed
  Z_HOP: Z position during hop
  Z_RETURN: Z position after return
gcode:
    {% set glyph = params.GLYPH | string %}
    {% set glyph_x = params.GLYPH_X | float %}
    {% set glyph_y = params.GLYPH_Y | float %}
    {% set extrusion = params.EXTRUSION | float %}
    {% set print_speed = params.PRINT_SPEED | int %}
    {% set travel_speed = params.TRAVEL_SPEED | int %}
    {% set retract_dist = params.RETRACT_DISTANCE | float %}
    {% set retract_speed = params.RETRACT_SPEED | int %}
    {% set unretract_speed = params.UNRETRACT_SPEED | int %}
    {% set z_hop = params.Z_HOP | float %}
    {% set z_return = params.Z_RETURN | float %}

    ; Retract, Z-hop, Move, Z-return, Unretract
    G1 E-{ retract_dist } F{ retract_speed }
    G1 Z{ z_hop } F{ travel_speed }
    G0 X{ glyph_x } Y{ glyph_y } F{ travel_speed }
    G1 Z{ z_return } F{ travel_speed }
    G1 E{ retract_dist } F{ unretract_speed }

    ; Draw the glyph
    {% if glyph == "period" %}
        _DRAW_PERIOD START_X={ glyph_x } START_Y={ glyph_y } EXTRUSION=0.0269 PRINT_SPEED={ print_speed }
    {% else %}
        _DRAW_DIGIT DIGIT={ glyph } START_X={ glyph_x } START_Y={ glyph_y } EXTRUSION={ extrusion } PRINT_SPEED={ print_speed } TRAVEL_SPEED={ travel_speed }
    {% endif %}

[gcode_macro _DRAW_DIGIT]
description: Draw any digit (0-9) using exact patterns from original G-code
parameters:
  DIGIT: The digit to draw (0-9)
  START_X: Starting X position for the glyph
  START_Y: Starting Y position for the glyph
  EXTRUSION: Extrusion amount per 2mm segment (E value)
  PRINT_SPEED: Print speed for drawing (mm/min)
  TRAVEL_SPEED: Travel speed for non-printing moves (mm/min)
gcode:
    {% set digit = params.DIGIT | string %}
    {% set x = params.START_X | float %}
    {% set y = params.START_Y | float %}
    {% set e = params.EXTRUSION | float %}
    {% set s = params.PRINT_SPEED | int %}
    {% set ts = params.TRAVEL_SPEED | int %}

    ; Each digit is drawn from START position using continuous paths
    ; Patterns match original.gcode exactly

    {% if digit == "0" %}
        ; Digit 0: Closed rectangle 4x2mm (6 segments)
        ; Pattern: +2X, +2X, +2Y, -2X, -2X, -2Y
        G1 X{ x + 2 } Y{ y } E{ e } F{ s }
        G1 X{ x + 4 } Y{ y } E{ e } F{ s }
        G1 X{ x + 4 } Y{ y + 2 } E{ e } F{ s }
        G1 X{ x + 2 } Y{ y + 2 } E{ e } F{ s }
        G1 X{ x } Y{ y + 2 } E{ e } F{ s }
        G1 X{ x } Y{ y } E{ e } F{ s }

    {% elif digit == "1" %}
        ; Digit 1: Single horizontal line 4mm (2 segments)
        ; Pattern: +2X, +2X
        G1 X{ x + 2 } Y{ y } E{ e } F{ s }
        G1 X{ x + 4 } Y{ y } E{ e } F{ s }

    {% elif digit == "2" %}
        ; Digit 2: Z-shape (5 segments)
        ; Pattern: +2Y, +2X, -2Y, +2X, +2Y
        G1 X{ x } Y{ y + 2 } E{ e } F{ s }
        G1 X{ x + 2 } Y{ y + 2 } E{ e } F{ s }
        G1 X{ x + 2 } Y{ y } E{ e } F{ s }
        G1 X{ x + 4 } Y{ y } E{ e } F{ s }
        G1 X{ x + 4 } Y{ y + 2 } E{ e } F{ s }

    {% elif digit == "3" %}
        ; Digit 3: Two L-shapes with travel (5 segments + 1 travel)
        ; Pattern: +2Y, +2X, -2Y, travel, +2X, -2Y
        G1 X{ x } Y{ y + 2 } E{ e } F{ s }
        G1 X{ x + 2 } Y{ y + 2 } E{ e } F{ s }
        G1 X{ x + 2 } Y{ y } E{ e } F{ s }
        G0 X{ x + 2 } Y{ y + 2 } F{ ts }
        G1 X{ x + 4 } Y{ y + 2 } E{ e } F{ s }
        G1 X{ x + 4 } Y{ y } E{ e } F{ s }

    {% elif digit == "4" %}
        ; Digit 4: Horizontal with down-left arm (4 segments + 1 travel)
        ; Pattern: +2X, +2X, travel, -2Y, -2X
        G1 X{ x + 2 } Y{ y + 2 } E{ e } F{ s }
        G1 X{ x + 4 } Y{ y + 2 } E{ e } F{ s }
        G0 X{ x + 2 } Y{ y + 2 } F{ ts }
        G1 X{ x + 2 } Y{ y } E{ e } F{ s }
        G1 X{ x } Y{ y } E{ e } F{ s }

    {% elif digit == "5" %}
        ; Digit 5: S-shape reversed (5 segments)
        ; Pattern: -2Y, +2X, +2Y, +2X, -2Y
        G1 X{ x } Y{ y - 2 } E{ e } F{ s }
        G1 X{ x + 2 } Y{ y - 2 } E{ e } F{ s }
        G1 X{ x + 2 } Y{ y } E{ e } F{ s }
        G1 X{ x + 4 } Y{ y } E{ e } F{ s }
        G1 X{ x + 4 } Y{ y - 2 } E{ e } F{ s }

    {% elif digit == "6" %}
        ; Digit 6: 6-shape with internal loop (6 segments)
        ; Pattern: -2Y, +2X, +2X, +2Y, -2X, -2Y
        G1 X{ x } Y{ y - 2 } E{ e } F{ s }
        G1 X{ x + 2 } Y{ y - 2 } E{ e } F{ s }
        G1 X{ x + 4 } Y{ y - 2 } E{ e } F{ s }
        G1 X{ x + 4 } Y{ y } E{ e } F{ s }
        G1 X{ x + 2 } Y{ y } E{ e } F{ s }
        G1 X{ x + 2 } Y{ y - 2 } E{ e } F{ s }

    {% elif digit == "7" %}
        ; Digit 7: L-shape up-right (3 segments)
        ; Pattern: +2Y, +2X, +2X
        G1 X{ x } Y{ y + 2 } E{ e } F{ s }
        G1 X{ x + 2 } Y{ y + 2 } E{ e } F{ s }
        G1 X{ x + 4 } Y{ y + 2 } E{ e } F{ s }

    {% elif digit == "8" %}
        ; Digit 8: Rectangle with center bar (7 segments + 1 travel)
        ; Pattern: +2X, +2X, +2Y, -2X, -2X, -2Y, travel, +2Y
        G1 X{ x + 2 } Y{ y } E{ e } F{ s }
        G1 X{ x + 4 } Y{ y } E{ e } F{ s }
        G1 X{ x + 4 } Y{ y + 2 } E{ e } F{ s }
        G1 X{ x + 2 } Y{ y + 2 } E{ e } F{ s }
        G1 X{ x } Y{ y + 2 } E{ e } F{ s }
        G1 X{ x } Y{ y } E{ e } F{ s }
        G0 X{ x + 2 } Y{ y } F{ ts }
        G1 X{ x + 2 } Y{ y + 2 } E{ e } F{ s }

    {% elif digit == "9" %}
        ; Digit 9: 6-shape flipped (6 segments + 1 travel)
        ; Pattern: +2X, +2X, +2Y, -2X, -2X, travel, +2Y
        G1 X{ x + 2 } Y{ y } E{ e } F{ s }
        G1 X{ x + 4 } Y{ y } E{ e } F{ s }
        G1 X{ x + 4 } Y{ y + 2 } E{ e } F{ s }
        G1 X{ x + 2 } Y{ y + 2 } E{ e } F{ s }
        G1 X{ x } Y{ y + 2 } E{ e } F{ s }
        G0 X{ x + 2 } Y{ y + 2 } F{ ts }
        G1 X{ x + 2 } Y{ y } E{ e } F{ s }

    {% endif %}

[gcode_macro _DRAW_PERIOD]
description: Draw the period (.) glyph
parameters:
  START_X: Starting X position for the glyph (top-right of period)
  START_Y: Starting Y position for the glyph
  EXTRUSION: Extrusion amount for period (typically smaller, ~0.0269)
  PRINT_SPEED: Print speed for drawing (mm/min)
gcode:
    {% set x = params.START_X | float %}
    {% set y = params.START_Y | float %}
    {% set e = params.EXTRUSION | float %}
    {% set s = params.PRINT_SPEED | int %}

    ; Period: Short horizontal line (0.75mm left from start)
    ; Pattern: -0.75X
    G1 X{ x - 0.75 } Y{ y } E{ e } F{ s }
