[gcode_macro _PRESSURE_ADVANCE_LOOP]
description: Outer loop for pressure advance values with pattern printing
gcode:
    {% set start_advance = params.START_ADVANCE | float %}
    {% set end_advance = params.END_ADVANCE | float %}
    {% set increment = params.INCREMENT | float %}
    {% set start_x = params.START_X | float %}
    {% set start_y = params.START_Y | float %}
    {% set y_start = params.Y_START | float %}
    {% set y_end = params.Y_END | float %}
    {% set e_increment = params.E_INCREMENT | float %}
    {% set x_wall_offset = params.X_WALL_OFFSET | float %}
    {% set step_distance = params.STEP_DISTANCE | float %}
    {% set group_spacing = params.GROUP_SPACING | float %}
    {% set print_speed = params.PRINT_SPEED | int %}
    {% set travel_speed = params.TRAVEL_SPEED | int %}
    {% set z_hop_distance = params.Z_HOP_DISTANCE | float %}
    {% set z_hop_return = params.Z_HOP_RETURN | float %}
    {% set retract_speed = params.RETRACT_SPEED | int %}
    {% set unretract_speed = params.UNRETRACT_SPEED | int %}
    {% set retract_distance = params.RETRACT_DISTANCE | float %}

    {% set group_width = (3 * step_distance) + group_spacing %}
    {% set num_iterations = ((end_advance - start_advance) / increment) | round(0, 'ceil') | int %}

    {% for i in range(num_iterations + 1) %}
        {% set current_x = start_x + (i * group_width) %}
        {% set current_advance = (start_advance + (i * increment)) | round(4) %}
        {% set advance_display = current_advance if current_advance != current_advance | int else current_advance | int %}

        SET_PRESSURE_ADVANCE ADVANCE={ advance_display }
        M117 PA { advance_display }

        G1 X{ (current_x + x_wall_offset) | round(4) } Y{ y_end } E{ e_increment } F{ print_speed }
        G1 X{ current_x | round(4) } Y{ y_start } E{ e_increment } F{ print_speed }

        G1 E-{ retract_distance } F{ retract_speed }
        G1 Z{ z_hop_distance } F{ travel_speed }
        G0 X{ (current_x + step_distance) | round(4) } Y{ start_y } F{ travel_speed }
        G1 Z{ z_hop_return } F{ travel_speed }
        G1 E{ retract_distance } F{ unretract_speed }

        G1 X{ (current_x + step_distance + x_wall_offset) | round(4) } Y{ y_end } E{ e_increment } F{ print_speed }
        G1 X{ (current_x + step_distance) | round(4) } Y{ y_start } E{ e_increment } F{ print_speed }

        G1 E-{ retract_distance } F{ retract_speed }
        G1 Z{ z_hop_distance } F{ travel_speed }
        G0 X{ (current_x + (2 * step_distance)) | round(4) } Y{ start_y } F{ travel_speed }
        G1 Z{ z_hop_return } F{ travel_speed }
        G1 E{ retract_distance } F{ unretract_speed }

        G1 X{ (current_x + (2 * step_distance) + x_wall_offset) | round(4) } Y{ y_end } E{ e_increment } F{ print_speed }
        G1 X{ (current_x + (2 * step_distance)) | round(4) } Y{ y_start } E{ e_increment } F{ print_speed }

        {% if i < num_iterations %}
            G1 E-{ retract_distance } F{ retract_speed }
            G1 Z{ z_hop_distance } F{ travel_speed }
            G0 X{ (current_x + group_width) | round(4) } Y{ start_y } F{ travel_speed }
            G1 Z{ z_hop_return } F{ travel_speed }
            G1 E{ retract_distance } F{ unretract_speed }
        {% endif %}
    {% endfor %}
