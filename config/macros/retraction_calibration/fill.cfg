[gcode_macro _FILL]
description: Generate 45-degree diagonal infill pattern for retraction calibration
gcode:
    {% set min_x = params.MIN_X | float %}
    {% set max_x = params.MAX_X | float %}
    {% set min_y = params.MIN_Y | float %}
    {% set max_y = params.MAX_Y | float %}
    {% set step_size = params.STEP_SIZE | float %}
    {% set print_speed = params.PRINT_SPEED | float %}
    {% set travel_speed = params.TRAVEL_SPEED | float %}
    {% set extrusion_per_mm = params.EXTRUSION_PER_MM | float %}

    {% set width = max_x - min_x %}
    {% set height = max_y - min_y %}
    {% set sqrt2 = 1.41421356237 %}

    ; Move to fill start position
    G0 X{{ "%.4f"|format(min_x) }} Y{{ "%.4f"|format(min_y) }} F{{ travel_speed | int }} ; Move to fill start

    ; Phase 1: Lines starting from bottom edge, drawing up-left toward left edge
    {% for i in range(1, ((width / step_size) | int) + 2) %}
        {% set start_x = min_x + (i * step_size) %}
        {% if start_x <= max_x %}
            {% set diag_length = [start_x - min_x, height] | min %}
            {% set end_x = start_x - diag_length %}
            {% set end_y = min_y + diag_length %}
            {% if diag_length > 0 %}
                {% set line_length = diag_length * sqrt2 %}
                {% set extrusion = line_length * extrusion_per_mm %}
                G0 X{{ "%.4f"|format(start_x) }} Y{{ "%.4f"|format(min_y) }} F{{ travel_speed | int }} ; Move
                G1 X{{ "%.4f"|format(end_x) }} Y{{ "%.4f"|format(end_y) }} E{{ "%.5f"|format(extrusion) }} F{{ print_speed | int }} ; Fill
            {% endif %}
        {% endif %}
    {% endfor %}

    ; Phase 2: Lines starting from top edge, drawing down-right toward right edge
    {% for i in range(1, ((height / step_size) | int) + 1) %}
        {% set start_y = max_y - (i * step_size) %}
        {% if start_y >= min_y %}
            {% set diag_length = [width, max_y - start_y] | min %}
            {% set end_x = min_x + diag_length %}
            {% set end_y = start_y + diag_length %}
            {% if end_y > max_y %}
                {% set diag_length = max_y - start_y %}
                {% set end_x = min_x + diag_length %}
                {% set end_y = max_y %}
            {% endif %}
            {% if diag_length > 0 %}
                {% set line_length = diag_length * sqrt2 %}
                {% set extrusion = line_length * extrusion_per_mm %}
                G0 X{{ "%.4f"|format(min_x) }} Y{{ "%.4f"|format(start_y) }} F{{ travel_speed | int }} ; Move
                G1 X{{ "%.4f"|format(end_x) }} Y{{ "%.4f"|format(end_y) }} E{{ "%.5f"|format(extrusion) }} F{{ print_speed | int }} ; Fill
            {% endif %}
        {% endif %}
    {% endfor %}
