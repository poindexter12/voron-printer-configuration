[gcode_macro _RETRACT_UNRETRACT]
description: Retract filament, perform Z hop, move to position, then unretract
gcode:
    {% set z_hop_distance = params.Z_HOP_DISTANCE | float %}
    {% set z_hop_return = params.Z_HOP_RETURN | float %}
    {% set travel_speed = params.TRAVEL_SPEED | float %}
    {% set retract_speed = params.RETRACT_SPEED | float %}
    {% set unretract_speed = params.UNRETRACT_SPEED | float %}
    {% set retract_distance = params.RETRACT_DISTANCE | float %}
    {% set move_x = params.MOVE_X | float %}
    {% set move_y = params.MOVE_Y | float %}

    G1 E-{ retract_distance } F{ retract_speed | int }
    G1 Z{ z_hop_distance } F{ travel_speed | int }
    G0 X{ move_x } Y{ move_y } F{ travel_speed | int }
    G1 Z{ z_hop_return } F{ travel_speed | int }
    G1 E{ retract_distance } F{ unretract_speed | int }
