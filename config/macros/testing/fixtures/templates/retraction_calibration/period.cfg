; Period glyph template for testing
; Period is drawn as a single small extrusion at the start position
{% set start_x = params.START_X | float %}
{% set start_y = params.START_Y | float %}
{% set extrusion = params.PERIOD_EXTRUSION | float %}
{% set print_speed = params.PRINT_SPEED | float %}
G1 X{{ start_x }} Y{{ start_y }} E{{ extrusion }} F{{ print_speed | int }}
