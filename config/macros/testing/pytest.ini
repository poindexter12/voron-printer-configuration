[pytest]
markers =
    retraction: marks tests as retraction tests (deselect with '-m "not retraction"')
    retraction_calibration: marks tests as retraction calibration tests (deselect with '-m "not retraction_calibration"')
    perimeter: marks tests as perimeter tests (deselect with '-m "not perimeter"')
    retract_unretract: marks tests as retract/unretract tests (deselect with '-m "not retract_unretract"')
    outer_loop: marks tests as outer loop tests (deselect with '-m "not outer_loop"')
    glyphs: marks tests as glyph drawing tests (deselect with '-m "not glyphs"')
    fill: marks tests as fill pattern tests (deselect with '-m "not fill"')
    layers: marks tests as layer orchestration tests (deselect with '-m "not layers"')
    combined: marks tests as combined component tests (deselect with '-m "not combined"')
    mcu: marks tests as MCU-level comparison tests (deselect with '-m "not mcu"')
    slow: marks tests as slow/long-running tests (deselect with '-m "not slow"')
    integration: marks tests as integration tests (deselect with '-m "not integration"')