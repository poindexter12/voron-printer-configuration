[gcode_macro PRESSURE_ADVANCE_CALIBRATION]
description: |
    Generates a pressure advance calibration pattern for 3D printer tuning.
    This macro creates multiple test patterns with different pressure advance values
    to help you find the optimal setting for your printer and filament.
    
    The pattern includes:
    - Anchor frame for adhesion
    - Multiple test patterns with increasing pressure advance values
    - Perimeter walls and infill for comprehensive testing
    
    Usage examples:
    - PRESSURE_ADVANCE_CALIBRATION (uses all defaults)
    - PRESSURE_ADVANCE_CALIBRATION PA_START_VALUE=0.01 PA_END_VALUE=0.06
    - PRESSURE_ADVANCE_CALIBRATION SIDE_LENGTH=25 WALL_COUNT=2
gcode:
    # ===== PRESSURE_ADVANCE_CALIBRATION - Main macro =====
    # This macro orchestrates the pressure advance calibration process
    
    ; Display start message
    M117 Starting PA calibration...
    
    ; Call the helper macro with default parameters
    ; You can override any of these by passing parameters to this macro
    _PRESSURE_ADVANCE_CALIBRATION \
        PA_START_VALUE={params.PA_START_VALUE|default(0.0)} \
        PA_END_VALUE={params.PA_END_VALUE|default(0.08)} \
        PA_INCREMENT={params.PA_INCREMENT|default(0.005)} \
        PATTERN_COUNT={params.PATTERN_COUNT|default(17)} \
        SIDE_LENGTH={params.SIDE_LENGTH|default(30.0)} \
        WALL_COUNT={params.WALL_COUNT|default(3)} \
        WALL_SPACING={params.WALL_SPACING|default(2.0)} \
        LAYER_HEIGHT={params.LAYER_HEIGHT|default(0.2)} \
        FIRST_LAYER_HEIGHT={params.FIRST_LAYER_HEIGHT|default(0.25)} \
        PRINT_SPEED={params.PRINT_SPEED|default(100)} \
        FIRST_LAYER_SPEED={params.FIRST_LAYER_SPEED|default(30)} \
        TRAVEL_SPEED={params.TRAVEL_SPEED|default(120)} \
        NOZZLE_TEMP={params.NOZZLE_TEMP|default(200)} \
        BED_TEMP={params.BED_TEMP|default(60)} \
        FAN_SPEED={params.FAN_SPEED|default(100)} \
        FIRST_LAYER_FAN={params.FIRST_LAYER_FAN|default(0)} \
        RETRACTION_DISTANCE={params.RETRACTION_DISTANCE|default(0.5)} \
        RETRACTION_SPEED={params.RETRACTION_SPEED|default(35)} \
        Z_HOP_HEIGHT={params.Z_HOP_HEIGHT|default(0.1)} \
        ANCHOR_FRAME_PERIMETERS={params.ANCHOR_FRAME_PERIMETERS|default(4)} \
        ANCHOR_LINE_WIDTH={params.ANCHOR_LINE_WIDTH|default(140)} \
        LINE_WIDTH={params.LINE_WIDTH|default(112.5)} \
        LAYER_COUNT={params.LAYER_COUNT|default(4)} \
        NOZZLE_DIAMETER={params.NOZZLE_DIAMETER|default(0.4)} \
        FILAMENT_DIAMETER={params.FILAMENT_DIAMETER|default(1.75)} \
        EXTRUSION_MULTIPLIER={params.EXTRUSION_MULTIPLIER|default(0.98)}
    
    ; Display completion message
    M117 PA calibration complete!

[gcode_macro _PRESSURE_ADVANCE_CALIBRATION]
description: Internal helper for pressure advance calibration (hidden)
gcode:
    # _PRESSURE_ADVANCE_CALIBRATION - prints pressure advance calibration patterns
    # 
    # Parameters (passed by the invoker):
    #   PA_START_VALUE        : starting pressure advance value (default 0.0)
    #   PA_END_VALUE          : ending pressure advance value (default 0.08)
    #   PA_INCREMENT          : increment between patterns (default 0.005)
    #   PATTERN_COUNT         : number of patterns to print (default 17)
    #   SIDE_LENGTH           : side length of each pattern (default 30.0)
    #   WALL_COUNT            : number of perimeter walls (default 3)
    #   WALL_SPACING          : spacing between walls (default 2.0)
    #   LAYER_HEIGHT          : layer height in mm (default 0.2)
    #   FIRST_LAYER_HEIGHT    : first layer height in mm (default 0.25)
    #   PRINT_SPEED           : print speed in mm/s (default 100)
    #   FIRST_LAYER_SPEED     : first layer speed in mm/s (default 30)
    #   TRAVEL_SPEED          : travel speed in mm/s (default 120)
    #   NOZZLE_TEMP           : nozzle temperature (default 200)
    #   BED_TEMP              : bed temperature (default 60)
    #   FAN_SPEED             : fan speed percent (default 100)
    #   FIRST_LAYER_FAN       : first layer fan speed percent (default 0)
    #   RETRACTION_DISTANCE   : retraction distance in mm (default 0.5)
    #   RETRACTION_SPEED      : retraction speed in mm/s (default 35)
    #   Z_HOP_HEIGHT          : Z hop height in mm (default 0.1)
    #   ANCHOR_FRAME_PERIMETERS : anchor frame perimeters (default 4)
    #   ANCHOR_LINE_WIDTH     : anchor line width percent (default 140)
    #   LINE_WIDTH            : line width percent (default 112.5)
    #   LAYER_COUNT           : total number of layers (default 4)
    #   NOZZLE_DIAMETER       : nozzle diameter in mm (default 0.4)
    #   FILAMENT_DIAMETER     : filament diameter in mm (default 1.75)
    #   EXTRUSION_MULTIPLIER  : extrusion multiplier (default 0.98)
    #   START_X               : starting X position (calculated for 200x200 bed)
    #   START_Y               : starting Y position (calculated for 200x200 bed)
    #   END_X                 : ending X position (calculated for 200x200 bed)
    #   END_Y                 : ending Y position (calculated for 200x200 bed)

    # ===== Parameter Setup =====
    {% set pa_start_value = params.PA_START_VALUE|default(0.0)|float %}
    {% set pa_end_value = params.PA_END_VALUE|default(0.08)|float %}
    {% set pa_increment = params.PA_INCREMENT|default(0.005)|float %}
    {% set pattern_count = params.PATTERN_COUNT|default(17)|int %}
    {% set side_length = params.SIDE_LENGTH|default(30.0)|float %}
    {% set wall_count = params.WALL_COUNT|default(3)|int %}
    {% set wall_spacing = params.WALL_SPACING|default(2.0)|float %}
    {% set layer_height = params.LAYER_HEIGHT|default(0.2)|float %}
    {% set first_layer_height = params.FIRST_LAYER_HEIGHT|default(0.25)|float %}
    {% set print_speed = params.PRINT_SPEED|default(100)|float %}
    {% set first_layer_speed = params.FIRST_LAYER_SPEED|default(30)|float %}
    {% set travel_speed = params.TRAVEL_SPEED|default(120)|float %}
    {% set nozzle_temp = params.NOZZLE_TEMP|default(200)|float %}
    {% set bed_temp = params.BED_TEMP|default(60)|float %}
    {% set fan_speed = params.FAN_SPEED|default(100)|float %}
    {% set first_layer_fan = params.FIRST_LAYER_FAN|default(0)|float %}
    {% set retraction_distance = params.RETRACTION_DISTANCE|default(0.5)|float %}
    {% set retraction_speed = params.RETRACTION_SPEED|default(35)|float %}
    {% set z_hop_height = params.Z_HOP_HEIGHT|default(0.1)|float %}
    {% set anchor_frame_perimeters = params.ANCHOR_FRAME_PERIMETERS|default(4)|int %}
    {% set anchor_line_width = params.ANCHOR_LINE_WIDTH|default(140)|float %}
    {% set line_width = params.LINE_WIDTH|default(112.5)|float %}
    {% set layer_count = params.LAYER_COUNT|default(4)|int %}
    {% set nozzle_diameter = params.NOZZLE_DIAMETER|default(0.4)|float %}
    {% set filament_diameter = params.FILAMENT_DIAMETER|default(1.75)|float %}
    {% set extrusion_multiplier = params.EXTRUSION_MULTIPLIER|default(0.98)|float %}

    # ===== Bed Size and Position Calculation =====
    ; For 200x200mm bed, center the pattern
    {% set bed_size_x = 200.0 %}
    {% set bed_size_y = 200.0 %}
    {% set pattern_width = 60.0 %}  ; 60mm wide pattern
    {% set pattern_height = 40.0 %} ; 40mm high pattern (for 17 patterns)
    
    ; Calculate centered positions
    {% set start_x = (bed_size_x - pattern_width) / 2 %}
    {% set end_x = (bed_size_x + pattern_width) / 2 %}
    {% set start_y = (bed_size_y - pattern_height) / 2 %}
    {% set end_y = (bed_size_y + pattern_height) / 2 %}

    # ===== Calculated Values =====
    {% set print_speed_mm_per_min = (print_speed * 60.0) %}
    {% set first_layer_speed_mm_per_min = (first_layer_speed * 60.0) %}
    {% set travel_speed_mm_per_min = (travel_speed * 60.0) %}
    {% set retraction_speed_mm_per_min = (retraction_speed * 60.0) %}
    {% set fan_speed_pwm = (fan_speed/100.0*255) | int %}
    {% set first_layer_fan_pwm = (first_layer_fan/100.0*255) | int %}

    # ===== Initial Setup =====
    ; Set temperatures and wait
    M140 S{bed_temp}
    M190 S{bed_temp}
    M104 S{nozzle_temp}
    M109 S{nozzle_temp}

    ; Home all axes
    G28

    ; Set initial conditions
    G21 ; Millimeter units
    G90 ; Absolute XYZ
    M83 ; Relative E
    G92 E0 ; Reset extruder distance

    ; Set first layer fan speed
    M106 S{first_layer_fan_pwm}

    # ===== Begin Printing =====
    ; Retract and move to start
    G1 E-{retraction_distance} F{retraction_speed_mm_per_min}
    G0 Z5 F{travel_speed_mm_per_min}
    G0 X{start_x} Y{start_y} F{travel_speed_mm_per_min}
    G0 Z{first_layer_height} F{travel_speed_mm_per_min}
    G1 E{retraction_distance} F{retraction_speed_mm_per_min}

    # ===== Generate Pressure Advance Patterns =====
    {% for pattern_index in range(pattern_count) %}
        {% set current_pa = pa_start_value + (pattern_index * pa_increment) %}
        
        ; Set pressure advance for this pattern
        SET_PRESSURE_ADVANCE ADVANCE={current_pa}
        M117 PA {current_pa}
        
        ; Print pattern {pattern_index + 1} of {pattern_count}
        ; This is where the actual pattern printing logic would go
        ; For now, this is a placeholder - you'll need to add the specific
        ; G-code for drawing the rectangles, perimeters, and fills
        
        ; Example: Print a simple rectangle for this pattern
        ; (You'll need to replace this with the actual pattern logic)
        G1 X{start_x} Y{start_y + (pattern_index * 2.5)} E0.5 F{first_layer_speed_mm_per_min}
        G1 X{end_x} Y{start_y + (pattern_index * 2.5)} E1.0 F{first_layer_speed_mm_per_min}
        G1 X{end_x} Y{start_y + (pattern_index * 2.5) + 2} E1.5 F{first_layer_speed_mm_per_min}
        G1 X{start_x} Y{start_y + (pattern_index * 2.5) + 2} E2.0 F{first_layer_speed_mm_per_min}
        G1 X{start_x} Y{start_y + (pattern_index * 2.5)} E2.5 F{first_layer_speed_mm_per_min}
        
        ; Retract and move to next pattern
        G1 E-{retraction_distance} F{retraction_speed_mm_per_min}
        G1 Z{z_hop_height} F{travel_speed_mm_per_min}
    {% endfor %}

    # ===== Finalization =====
    ; Move to safe position
    G0 Z10 F{travel_speed_mm_per_min}
    G0 X{start_x} Y{start_y} F{travel_speed_mm_per_min}
    
    ; Turn off heaters and fan
    M104 S0
    M140 S0
    M106 S0
    
    ; Display completion message
    M117 Pressure advance calibration complete!
